<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .home-container {
            background: #ffffff;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin-bottom: 16px;
            color: #333;
        }

        p {
            margin-bottom: 24px;
            color: #555;
        }

        button {
            padding: 12px 24px;
            background: #ef4444;
            color: #ffffff;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

    <div class="home-container">
        <h1>Welcome! {{ user.username }} </h1>
        <p>You are successfully logged in.</p>

        <!-- Logout button -->
        <form action="{% url 'sign-out' %}" method="get">
            <button type="submit">Logout</button>
        </form>
    </div>

</body>
</html>
